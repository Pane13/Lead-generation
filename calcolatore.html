ll'acconto: chiedilo al manager per telefono davanti al cliente, solo dopo che il cliente ha detto che il resto va bene, e concedilo in cambio di una decisione oggi. Non dire «ultima occasione» se non lo è.","Se resta il no, fissa data e ora del prossimo incontro prima di uscire e lascia una proposta scritta.","Non spingere chi è in difficoltà economica o davvero incerto: il contratto dura 24 mesi e la pressione scorretta è vietata anche verso le microimprese."])+'<h2>Numeri e rischi: cosa dire e cosa no</h2><div class="warn">Prospettare il fallimento e dare numeri ottimistici non vanno fatti: sono pratiche ingannevoli o aggressive, anche verso le microimprese, e ti espongono personalmente. Meglio chiudere con i fatti.</div>'+li(["Usa i numeri del cliente (valore di un cliente, lavori al mese), mai i tuoi.","Mostra il pareggio e i suoi multipli (×2, ×3, ×4, ×5). Dì che sono simulazioni, non previsioni, e chiedi a lui se il numero di clienti del pareggio gli sembra realistico.","Non dire che fallirà o perderà l'attività. Dì cosa è vero: quante persone cercano il suo servizio in zona (dato del Keyword Planner), chi compare oggi e che lui non compare.","Il costo dell'inazione si dice così: «ogni mese quelle ricerche vanno a qualcun altro». Verificabile e senza minacce.","Mai garantire posizioni, telefonate o ricavi."])+'<h2>Per superare il filtro</h2>'+li(["Dì chi sei e per quale azienda chiami, senza giri.","Spiega il motivo in una frase e chiedi quando è più facile trovare il titolare.","Invia prima una email o un messaggio di tre righe, poi richiama citandolo.","Se puoi, passa di persona.","Non fingerti cliente o amico e non dire che è urgente: danneggia la fiducia."])+'<h2>Come usare le risposte</h2>'+li(["Il valore di un cliente diviso la rata dà quanti clienti bastano a ripagare il piano.","Zone e servizi elencati danno parole chiave e pagine, quindi il piano.","Chi decide e chi gestisce il sito dicono se serve un secondo incontro.","Le esperienze passate dicono quali obiezioni preparare."])+'<p class="mu">Gli orari sono stime: correggili dopo le chiamate reali.</p>'}

"Studi dentistici":[3,"Hanno budget, ma decidono con i soci e filtrano molto.","«Quanto vale un paziente per cure estese? Un solo paziente copre molti mesi di rata, e la chat raccoglie le richieste che oggi perde.»","«Chi altro decide? Se c'è un socio, lo coinvolgiamo adesso con una chiamata di 5 minuti, oppure fissiamo l'incontro con entrambi prima di uscire.»"],
