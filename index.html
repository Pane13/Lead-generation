<!DOCTYPE html>
<html lang="it"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0f172a"><title>Diamondweb Leads</title>
<style>
[hidden]{display:none!important}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{overscroll-behavior:none;height:100%;margin:0;font:15px system-ui,sans-serif;color:#1f2937;background:#f3f4f6}
button,input,select,textarea{font:inherit}
#app{height:100%;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top)}
#top{background:#0f172a;padding:8px;display:flex;flex-direction:column;gap:6px;z-index:5}
.row{display:flex;gap:6px;align-items:center}
input[type=text],select,textarea{padding:10px;border:1px solid #d1d5db;border-radius:8px;width:100%;background:#fff}
.btn{padding:10px 14px;border:0;border-radius:8px;background:#2563eb;color:#fff;white-space:nowrap}
.btn.g{background:#e5e7eb;color:#111}.btn:disabled{opacity:.5}
#views{flex:1;position:relative;min-height:0}
.view{overscroll-behavior:contain;position:absolute;inset:0;overflow:auto;display:none}
.view.on{display:block}
#map{width:100%;height:100%}
#fab{position:absolute;left:50%;transform:translateX(-50%);bottom:14px;box-shadow:0 2px 8px #0006;border-radius:24px;padding:13px 22px;font-weight:600}
.sticky{position:sticky;top:0;background:#fff;padding:8px;border-bottom:1px solid #e5e7eb;z-index:2;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.chip{padding:6px 12px;border-radius:16px;background:#e5e7eb;border:0;font-size:13px}.chip.on{background:#2563eb;color:#fff}
.item{background:#fff;padding:10px 12px;border-bottom:1px solid #eee;display:flex;gap:10px;align-items:center}
.item .t{flex:1;min-width:0}.item b{display:block}.item small{color:#6b7280;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cbtn{flex:none;width:48px;height:48px;border-radius:24px;background:#16a34a;color:#fff;text-decoration:none;display:flex;align-items:center;justify-content:center;font-size:22px}
.tag{display:inline-block;font-size:11px;padding:1px 7px;border-radius:9px;color:#fff;margin-left:4px;vertical-align:middle}
nav{display:flex;background:#fff;border-top:1px solid #e5e7eb;padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;padding:9px 0;border:0;background:none;font-size:12px;color:#6b7280}
nav button.on{color:#2563eb;font-weight:600}nav span{display:block;font-size:20px}
#panel{overscroll-behavior:contain;position:fixed;left:0;right:0;bottom:0;max-height:78vh;overflow:auto;background:#fff;border-radius:16px 16px 0 0;box-shadow:0 -4px 20px #0006;padding:14px 14px calc(14px + env(safe-area-inset-bottom));z-index:20;display:none}
.call{display:block;text-align:center;background:#16a34a;color:#fff;text-decoration:none;padding:15px;border-radius:10px;font-size:18px;font-weight:600;margin:10px 0}
.st{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0}
.st button{padding:11px;border:2px solid transparent;border-radius:8px;background:#f3f4f6}.st button.on{border-color:#111}
.warn{background:#fef3c7;padding:8px;border-radius:8px;font-size:13px;margin:8px 0}
.item.nosite{background:#fff7ed;border-left:5px solid #ea580c}
.item.due{background:#fef2f2;border-left:5px solid #dc2626}
.cards{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;padding:10px}
.card{background:#fff;border-radius:10px;padding:10px;font-size:13px;box-shadow:0 1px 3px #0002}
.card b{display:block;font-size:26px}.card i{display:block;font-size:11px;color:#dc2626;font-style:normal}
.seo{background:#eff6ff;border-radius:8px;padding:10px;font-size:13px;margin:10px 0;line-height:1.55}
.seo a{color:#2563eb}
.muted{color:#6b7280;font-size:13px}.pad{padding:14px}
#setup{position:fixed;inset:0;background:#000b;display:flex;align-items:center;justify-content:center;z-index:99;padding:16px}
#setup div{background:#fff;padding:20px;border-radius:12px;width:100%;max-width:440px}
</style></head><body>
<div id="setup" hidden><div>
<h3 style="margin-top:0">Configurazione Google Maps</h3>
<p class="muted">Incolla una chiave Google Cloud con <b>Maps JavaScript API</b> e <b>Places API (New)</b> abilitate. Resta salvata solo su questo dispositivo.</p>
<input type="text" id="key" placeholder="AIza..."><p><button class="btn" onclick="saveKey()">Salva e avvia</button></p></div></div>

<div id="app">
 <div id="top">
  <select id="cat" onchange="pickCat()"></select>
  <div class="row"><input type="text" id="q" placeholder="Cosa cerchi? es. parrucchieri" onkeydown="if(event.key=='Enter')search()"><button class="btn" onclick="search()">🔍</button></div>
  <div class="row"><input type="text" id="go" placeholder="Vai a… (città, zona)" onkeydown="if(event.key=='Enter')goTo()"><button class="btn g" onclick="goTo()">Vai</button><button class="btn g" onclick="locate()">📍</button><button class="btn g" onclick="resetKey()">🔑</button></div>
  <div class="row" style="justify-content:space-between"><div id="msg" style="color:#fbbf24;font-size:12px;flex:1"></div><div id="usage" onclick="setLimit()" title="Tocca per cambiare il limite" style="color:#fff;background:#1e293b;border-radius:10px;padding:3px 9px;font-size:12px;white-space:nowrap">📊 0/30</div></div>
 </div>
 <div id="views">
  <div class="view on" id="v-map"><div id="map"></div><button class="btn" id="fab" onclick="search()">Cerca in quest'area</button></div>
  <div class="view" id="v-list">
   <div class="sticky"><div class="row" style="width:100%"><input type="text" id="lq" placeholder="🔎 Cerca nei risultati: nome o numero…" autocomplete="off" oninput="clearTimeout(window._lt);window._lt=setTimeout(render,200)"><button class="btn g" onclick="document.getElementById('lq').value='';render()">✕</button></div><button class="chip on" data-v="new" onclick="setLv('new',this)">Da chiamare</button>
    <button class="chip" data-v="called" onclick="setLv('called',this)">Chiamati</button>
    <button class="chip" data-v="all" onclick="setLv('all',this)">Tutti</button>
    <button class="chip" id="cCb" data-v="cb" onclick="setLv('cb',this)">🔁 Da ricontattare</button>
    <button class="chip on" id="cPhone" onclick="this.classList.toggle('on');render()">📞 Con tel.</button>
    <button class="chip" id="cNo" onclick="this.classList.toggle('on');render()">🔥 Senza sito</button>
    <button class="chip" id="cSort" onclick="this.classList.toggle('on');render()">⭐ Priorità SEO</button>
    <button class="chip" onclick="search(true)">🔎 Approfondisci</button>
    <div class="muted" style="width:100%">SEO ★ = posizionamento stimato: 1 debole (grande opportunità) → 5 forte</div></div>
   <div id="list"></div></div>
  <div class="view" id="v-reg">
   <div class="sticky"><div class="row" style="width:100%"><input type="text" id="rq" placeholder="🔎 Cerca per nome o numero di telefono…" autocomplete="off" oninput="renderReg()"><button class="btn g" onclick="document.getElementById('rq').value='';renderReg()">✕</button></div><select id="regSt" onchange="renderReg()" style="flex:1 1 130px"></select><button class="chip" id="rTod" onclick="setRng('today')">Oggi</button><button class="chip on" id="rAll" onclick="setRng('all')">Totale</button><button class="btn g" onclick="exportCsv()">⬇ CSV</button></div>
   <div id="stats"></div>
   <div class="row pad" style="padding-top:0"><button class="btn g" onclick="backup()">💾 Backup dati</button><button class="btn g" onclick="document.getElementById('rfile').click()">📥 Ripristina</button><input type="file" id="rfile" accept=".json" hidden onchange="restore(this)"></div>
   <div id="reg"></div></div>
 </div>
 <nav>
  <button class="on" data-t="map" onclick="tab('map')"><span>🗺️</span>Mappa</button>
  <button data-t="list" onclick="tab('list')"><span>📋</span><i id="cnt">Lista</i></button>
  <button data-t="reg" onclick="tab('reg')"><span>📒</span><i id="rcnt">Registro</i></button>
 </nav>
</div>
<div id="panel"></div>

<script>
const ST={called:['Chiamato','#0ea5e9'],nr:['Non risponde','#6b7280'],cb:['Da richiamare','#f59e0b'],int:['Interessato','#16a34a'],trat:['In trattativa','#7c3aed'],app:['Appuntamento','#db2777'],no:['Non interessato','#dc2626']};
let SESS={};try{SESS=JSON.parse(localStorage.getItem('dw_sess')||'{}')}catch(e){}
let map,results=SESS.results||[],markers={},lv='new',pending=null,curId=null;
let db={};
try{db=JSON.parse(localStorage.getItem('dw_leads')||'{}')}catch(e){
 localStorage.setItem('dw_corrupt',localStorage.getItem('dw_leads'));alert('Dati non leggibili: ne ho conservato una copia. Contattami prima di continuare.')}
const save=()=>localStorage.setItem('dw_leads',JSON.stringify(db));
// copia di sicurezza giornaliera (stato all'apertura del giorno) conservata sul dispositivo
try{const t0=new Date().toISOString().slice(0,10),bk=JSON.parse(localStorage.getItem('dw_snap')||'{}');
 if(bk.day!==t0&&Object.keys(db).length)localStorage.setItem('dw_snap',JSON.stringify({day:t0,data:db}))}catch(e){}
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
$('regSt').innerHTML='<option value="">Tutti gli stati</option>'+Object.entries(ST).map(([k,v])=>`<option value="${k}">${v[0]}</option>`).join('');

if(localStorage.gmkey)loadMaps(localStorage.gmkey);else $('setup').hidden=false;
const CATS={
'🏗️ Edilizia e casa':{'Imprese edili':'imprese edili','Studi di architettura':'studi di architettura','Geometri e ingegneri':'geometri ingegneri','Serramenti e infissi':'serramenti infissi','Fotovoltaico':'impianti fotovoltaici','Climatizzazione e caldaie':'climatizzazione caldaie','Idraulici':'idraulici','Elettricisti':'elettricisti','Falegnami e arredo su misura':'falegnamerie arredo su misura','Imbianchini e cartongesso':'imbianchini cartongesso','Cucine e arredo bagno':'cucine arredo bagno','Giardinieri e paesaggisti':'giardinieri paesaggisti','Traslochi':'traslochi','Agenzie immobiliari':'agenzie immobiliari'},
'🩺 Salute e benessere':{'Dentisti':'dentisti','Cliniche e poliambulatori':'cliniche poliambulatori','Fisioterapisti':'fisioterapisti','Veterinari':'veterinari','Parrucchieri':'parrucchieri','Barbieri':'barbieri','Centri estetici':'centri estetici','Palestre':'palestre','Ottici':'ottici'},
'🚗 Auto':{'Carrozzerie':'carrozzerie','Officine meccaniche':'officine meccaniche','Concessionarie auto':'concessionarie auto','Autoscuole':'autoscuole'},
'💼 Servizi professionali':{'Avvocati':'avvocati','Commercialisti':'commercialisti','Notai':'notai'},
'🍽️ Ristorazione, hotel e negozi':{'Ristoranti':'ristoranti','Pizzerie':'pizzerie','Bar e caffetterie':'bar caffetterie','Hotel':'hotel','B&B e affittacamere':'b&b affittacamere','Agriturismi e cantine':'agriturismi cantine','Panifici':'panifici','Fioristi':'fioristi','Negozi di abbigliamento':'negozi abbigliamento','Agenzie di viaggio':'agenzie di viaggio'}};
$('cat').innerHTML='<option value="">📋 Scegli la tipologia di azienda…</option>'+Object.entries(CATS).map(([g,o])=>`<optgroup label="${g}">${Object.entries(o).map(([l,q])=>`<option value="${q}">${l}</option>`).join('')}</optgroup>`).join('');
function pickCat(){const v=$('cat').value;if(!v)return;$('q').value=v;
 if(!map)return msg('Attendi il caricamento della mappa…');search()}
function saveSess(){try{const c=map&&map.getCenter();localStorage.setItem('dw_sess',JSON.stringify({results,q:$('q').value,c:c?{lat:c.lat(),lng:c.lng()}:null,z:map&&map.getZoom()}))}catch(e){}}
const dstr=t=>{const x=new Date(t);return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0')};
const today=()=>dstr(Date.now());
let rng='all',use=JSON.parse(localStorage.getItem('dw_use')||'{}');
// contatore richieste a Google (conteggio locale, limite giornaliero impostabile)
function rollDay(){if(use.day!==today()){use.day=today();use.n=0}if(!use.lim)use.lim=30}
function saveUse(){localStorage.setItem('dw_use',JSON.stringify(use))}
function showUse(){rollDay();const el=$('usage'),n=use.n,l=use.lim;el.textContent=`📊 ${n}/${l}`;el.style.background=n>=l?'#b91c1c':n>=l*.8?'#b45309':'#1e293b'}
function useReq(k){rollDay();
 if(use.n+k>use.lim&&!confirm(`Hai usato ${use.n}/${use.lim} richieste oggi e questa azione ne usa ${k}: superi il limite che ti sei impostato. Continuare?`))return false;
 use.n+=k;saveUse();showUse();return true}
function setLimit(){rollDay();const v=parseInt(prompt('Limite giornaliero di richieste a Google (es. 30). Tienilo uguale o inferiore alla quota impostata nella console Google.',use.lim));
 if(v>0){use.lim=v;saveUse();showUse()}}
showUse();
function stats(){const all=Object.values(db),t=today();
 const inR=d=>rng==='all'||(d.last&&dstr(d.last)===t),cnt=k=>all.filter(d=>d.st===k&&inR(d)).length;
 return{calls:all.reduce((n,d)=>n+(rng==='all'?(d.calls||0):(d.hist||[]).filter(x=>dstr(x)===t).length),0),
  app:cnt('app'),no:cnt('no'),int:cnt('int'),trat:cnt('trat'),nr:cnt('nr'),comp:all.filter(d=>d.calls&&inR(d)).length,
  cb:all.filter(d=>d.st==='cb').length,due:all.filter(d=>d.st==='cb'&&d.when&&d.when<=t).length}}
function backup(){
 const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify({app:'dw-leads',v:1,date:Date.now(),leads:db})],{type:'application/json'}));
 a.download='diamondweb-backup-'+today()+'.json';a.click();localStorage.setItem('dw_lastbak',Date.now());renderReg()}
function restore(inp){const f=inp.files[0];if(!f)return;const rd=new FileReader();
 rd.onload=()=>{try{const j=JSON.parse(rd.result),src=j.leads||j;let n=0;
  for(const [id,d] of Object.entries(src)){const c=db[id];if(!c||(d.last||0)>(c.last||0)||(d.calls||0)>(c.calls||0)){db[id]=Object.assign({},c,d);n++}}
  save();render();alert(n+' contatti ripristinati o aggiornati.')}catch(e){alert('File di backup non valido')}inp.value=''};rd.readAsText(f)}
function setRng(r){rng=r;$('rTod').classList.toggle('on',r==='today');$('rAll').classList.toggle('on',r==='all');renderReg()}
function goReg(k){$('rq').value='';$('regSt').value=k;renderReg()}
// ricerca nel registro: nome/titolare/note/indirizzo (senza accenti, più parole) oppure numero (anche parziale, con o senza +39)
const fold=x=>String(x||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
const norm=n=>{n=String(n||'').replace(/\D/g,'');if(n.startsWith('0039'))n=n.slice(4);else if(n.startsWith('39')&&n.length>10)n=n.slice(2);return n};
function matchQ(d,q){
 const qd=norm(q);
 if(/^[\d\s+().-]+$/.test(q))return qd.length>=3&&(norm(d.phone).includes(qd)||norm(d.piva).includes(qd));
 const hay=fold([d.name,d.owner,d.notes,d.addr,d.email,d.kind].join(' '));
 return fold(q).split(/\s+/).filter(Boolean).every(w=>hay.includes(w))||(qd.length>=4&&norm(d.phone).includes(qd))}
function msg(t){$('msg').textContent=t}
window.addEventListener('beforeunload',e=>{if(!window._noGuard){e.preventDefault();e.returnValue=''}});
function resetKey(){if(confirm('Cambiare la chiave API?')){window._noGuard=true;localStorage.removeItem('gmkey');location.reload()}}
window.addEventListener('error',e=>msg('Errore: '+e.message));
window.addEventListener('unhandledrejection',e=>msg('Errore: '+(e.reason&&e.reason.message||e.reason)));
function saveKey(){const k=$('key').value.trim().replace(/["'\s]/g,'');if(!k)return;localStorage.gmkey=k;$('setup').hidden=true;loadMaps(k)}
function loadMaps(k){msg('Caricamento mappa…');const s=document.createElement('script');
 s.src=`https://maps.googleapis.com/maps/api/js?key=${k}&v=weekly&loading=async&callback=initMap&language=it`;
 s.onerror=()=>alert('Impossibile caricare Google Maps');document.head.appendChild(s)}
window.gm_authFailure=()=>{msg('Chiave non valida, scaduta o API non abilitate.');alert('Chiave non valida, scaduta o API non abilitate.');localStorage.removeItem('gmkey');$('setup').hidden=false};

async function initMap(){
 const {Map}=await google.maps.importLibrary('maps');await google.maps.importLibrary('places');
 map=new Map($('map'),{center:SESS.c||{lat:45.4642,lng:9.19},zoom:SESS.z||15,mapTypeControl:false,streetViewControl:false,fullscreenControl:false,gestureHandling:'greedy'});
 // clic su un luogo di Google Maps (icone/POI) -> scheda con chiamata
 map.addListener('click',async e=>{
  if(!e.placeId)return closePanel();
  e.stop();if(!useReq(1))return;
  try{const {Place}=await google.maps.importLibrary('places');
   const p=new Place({id:e.placeId});await p.fetchFields({fields:FIELDS});
   const l=toLead(p,'');if(!results.find(r=>r.id===l.id))results.unshift(l);render();openPanel(l.id)}
  catch(err){alert('Errore: '+err.message)}
 });
 if(SESS.q)$('q').value=SESS.q;map.addListener('idle',saveSess);
 if(!SESS.c)locate(true);render();msg('✓ Mappa pronta. Scrivi cosa cerchi e premi «Cerca».');
}
function locate(silent){navigator.geolocation&&navigator.geolocation.getCurrentPosition(p=>{map.setCenter({lat:p.coords.latitude,lng:p.coords.longitude});map.setZoom(16)},()=>{if(!silent)alert('Posizione non disponibile')},{enableHighAccuracy:true,timeout:8000})}
async function goTo(){
 const q=$('go').value.trim();if(!q)return;if(!useReq(1))return;
 const {Place}=await google.maps.importLibrary('places');
 const {places}=await Place.searchByText({textQuery:q,fields:['location','viewport'],maxResultCount:1,language:'it'});
 if(places[0]){places[0].viewport?map.fitBounds(places[0].viewport):map.setCenter(places[0].location);tab('map')}
}
const FIELDS=['id','displayName','formattedAddress','location','nationalPhoneNumber','internationalPhoneNumber','websiteURI','primaryTypeDisplayName','businessStatus'];
const toLead=(p,q)=>({id:p.id,name:p.displayName,addr:p.formattedAddress||'',phone:p.nationalPhoneNumber||p.internationalPhoneNumber||'',web:p.websiteURI||'',
 rating:p.rating,n:p.userRatingCount,kind:p.primaryTypeDisplayName||q||'',q:q||'',lat:p.location.lat(),lng:p.location.lng()});

async function search(deep){
 const q=$('q').value.trim();if(!q)return $('q').focus();
 const n=deep?3:1;if(deep&&!confirm('Ricerca approfondita: 9 richieste a Google (fino a 180 risultati). Continuare?'))return;
 const b=map.getBounds(),ne=b.getNorthEast(),sw=b.getSouthWest(),N=ne.lat(),S=sw.lat(),E=ne.lng(),W=sw.lng();
 const dl=(N-S)/n,dg=(E-W)/n,boxes=[];
 for(let i=0;i<n;i++)for(let j=0;j<n;j++)boxes.push(new google.maps.LatLngBounds({lat:S+i*dl,lng:W+j*dg},{lat:S+(i+1)*dl,lng:W+(j+1)*dg}));
 if(!useReq(boxes.length))return;
 $('fab').disabled=true;$('fab').textContent='Ricerca…';
 try{
  const {Place}=await google.maps.importLibrary('places');
  const out=await Promise.allSettled(boxes.map(bx=>Place.searchByText({textQuery:q,fields:FIELDS,locationRestriction:bx,maxResultCount:20,language:'it'})));
  const seen={};results=[];
  out.forEach(o=>o.status==='fulfilled'&&o.value.places.forEach(p=>{if(p.businessStatus==='CLOSED_PERMANENTLY'||seen[p.id])return;seen[p.id]=1;results.push(toLead(p,q))}));
  if(!results.length&&out[0].status==='rejected')throw out[0].reason;
  $('lq').value='';render();if(deep)tab('list')
 }catch(e){msg('Errore ricerca: '+e.message);alert('Errore ricerca: '+e.message)}
 $('fab').disabled=false;$('fab').textContent="Cerca in quest'area";
 if(!results.length)msg('Nessun risultato in quest\'area: zooma/sposta la mappa o cambia ricerca.');else msg('✓ '+results.length+' risultati');
}
function tab(t){document.querySelectorAll('.view').forEach(v=>v.classList.toggle('on',v.id==='v-'+t));
 document.querySelectorAll('nav [data-t]').forEach(b=>b.classList.toggle('on',b.dataset.t===t))}
function setLv(v,el){lv=v;document.querySelectorAll('[data-v]').forEach(c=>c.classList.toggle('on',c===el));render()}
const tel=r=>r.phone.replace(/[^\d+]/g,'');
function visible(){
 const v=visible0(),q=($('lq').value||'').trim();
 return q?v.filter(r=>matchQ(Object.assign({},r,db[r.id]),q)):v}
function visible0(){
 if(lv==='cb')return Object.values(db).filter(d=>d.st==='cb'&&(!$('cPhone').classList.contains('on')||d.phone)).sort((x,y)=>(x.when||'9999').localeCompare(y.when||'9999'));
 const v=results.filter(r=>{
 if($('cPhone').classList.contains('on')&&!r.phone)return false;
 if($('cNo').classList.contains('on')&&r.web)return false;
 return lv==='all'||(lv==='new'?!done(r.id):done(r.id))});
 return $('cSort').classList.contains('on')?v.sort((a,b)=>seo(a).n-seo(b).n):v}
const badge=id=>{const d=db[id];if(!d||!d.st)return'';
 let h=`<span class="tag" style="background:${ST[d.st][1]}">${ST[d.st][0]}</span>`;
 if(d.when&&['cb','app','trat'].includes(d.st)){const t=today(),f=d.when.split('-').reverse().slice(0,2).join('/');
  h+=d.when<t?`<span class="tag" style="background:#dc2626">⏰ ${f} scaduto</span>`:d.when===t?'<span class="tag" style="background:#ea580c">📅 OGGI</span>':`<span class="tag" style="background:#0369a1">📅 ${f}</span>`}
 return h};
const isDue=id=>{const d=db[id];return !!(d&&d.st==='cb'&&d.when&&d.when<=today())};
// Parole chiave tipiche di ricerca locale per settore ({c} = città). Indicative: verifica i volumi con Google Keyword Planner.
const KW=[

function cityOf(r){const m=(r.addr||'').match(/\b\d{5}\s+([^,]+?)(?:\s+[A-Z]{2})?(?:,|$)/);return m?m[1].trim():''}
function keywords(r){
 const t=((r.kind||'')+' '+(r.q||'')).toLowerCase(),hit=KW.find(k=>k[0].test(t)),c=cityOf(r);
 const k=(r.kind||r.q||'attività').toLowerCase();
 const base=hit?hit[1]:[k+' {c}',k+' vicino a me',k+' migliore {c}'];
 return base.map(x=>(c?x.replace('{c}',c.toLowerCase()):x.replace(' {c}','')).trim());
}
// Stima del posizionamento SEO (1-5) dai segnali disponibili: NON è la posizione reale su Google
const SOCIAL=/facebook\.|instagram\.|linktr\.ee|tiktok\.|wa\.me|paginegialle|tripadvisor|thefork|booking\.com|treatwell|fresha|planity|business\.site|google\.com/i;
const FREE=/wixsite\.|weebly\.|jimdo|altervista|webnode|site123|godaddysites|square\.site|wordpress\.com|blogspot/i;
function seo(r){
 if(!r.web)return{n:1,w:'Nessun sito web: invisibile nei risultati organici.'};
 if(SOCIAL.test(r.web))return{n:1,w:'Solo social/directory: nessun sito proprio da posizionare.'};
 if(FREE.test(r.web))return{n:2,w:'Sito su piattaforma gratuita: dominio debole per la SEO.'};
 const host=r.web.replace(/^https?:\/\/(www\.)?/i,'').split('/')[0].toLowerCase(),stem=keywords(r)[0].split(' ')[0].slice(0,7).replace(/[^a-z]/g,'');
 return stem.length>=4&&host.includes(stem)?{n:4,w:'Sito con parola chiave nel dominio: verifica contenuti e velocità.'}
  :{n:3,w:'Sito con dominio proprio: verifica contenuti, velocità e posizione reale (il protocollo HTTPS non è rilevabile in modo affidabile).'};
}
const stars=n=>'★'.repeat(n)+'☆'.repeat(5-n),scol=n=>n<=2?'#dc2626':n===3?'#d97706':'#16a34a',slab=n=>n<=2?'SEO debole':n===3?'SEO medio':'SEO discreto';
function row(r,reg){const k=keywords(r),s=seo(r);
 return `<div class="item ${r.web?'':'nosite'} ${isDue(r.id)?'due':''}" onclick="openPanel('${r.id}')"><div class="t"><b>${esc(r.name)}${r.web?'':'<span class="tag" style="background:#ea580c">SENZA SITO</span>'}${badge(r.id)}</b>
 <small>${esc(r.kind)}${r.addr?' · '+esc(r.addr):''}</small>
 <small>${r.phone?'📞 '+esc(r.phone):'nessun telefono'}${db[r.id]&&db[r.id].owner?' · 👤 '+esc(db[r.id].owner):''}${db[r.id]&&db[r.id].notes?' · 📝 '+esc(db[r.id].notes):''}</small>
 <small style="color:${scol(s.n)}">SEO ${stars(s.n)} · 🔑 ${esc(k[0])}</small></div>
 ${r.phone?`<a class="cbtn" href="tel:${tel(r)}" onclick="event.stopPropagation();called('${r.id}')">📞</a>`:''}</div>`}
function render(){
 if(!map)return;const vis=visible(),lq=($('lq').value||'').trim();
 $('cCb').textContent='🔁 Da ricontattare ('+Object.values(db).filter(d=>d.st==='cb').length+')';
 $('cnt').textContent=`Lista (${vis.length})`;
 $('list').innerHTML=vis.map(r=>row(r)).join('')||(lv==='cb'?'<p class="muted pad">Nessuna azienda da ricontattare: imposta lo stato «Da richiamare» su un contatto.</p>':'<p class="muted pad">Nessun contatto. Sposta la mappa, scrivi cosa cerchi (es. «parrucchieri») e premi «Cerca in quest\'area».</p>');
 if(lq)$('list').innerHTML=`<div class="muted" style="padding:8px 12px">${vis.length} risultat${vis.length===1?'o':'i'} per «${esc(lq)}» nella vista «${{new:'Da chiamare',called:'Chiamati',all:'Tutti',cb:'Da ricontattare'}[lv]}»${vis.length?'':' — prova la vista «Tutti»'}</div>`+(vis.length?$('list').innerHTML:'');
 Object.values(markers).forEach(m=>m.setMap(null));markers={};
 vis.forEach(r=>{const s=db[r.id]&&db[r.id].st;
  const m=new google.maps.Marker({map,position:{lat:r.lat,lng:r.lng},title:r.name,
   icon:{path:google.maps.SymbolPath.CIRCLE,scale:9,fillColor:s?ST[s][1]:'#2563eb',fillOpacity:1,strokeColor:r.web?'#fff':'#ea580c',strokeWeight:r.web?2:4}});
  m.addListener('click',()=>openPanel(r.id));markers[r.id]=m});
 renderReg();saveSess();
}
function renderReg(){
 const f=$('regSt').value,all=Object.values(db).sort((a,b)=>f==='cb'?(a.when||'9999').localeCompare(b.when||'9999'):(b.last||0)-(a.last||0));
 $('rcnt').textContent=`Registro (${all.length})`;
 const S=stats();
 $('stats').innerHTML=`<div class="cards">
 <div class="card" onclick="goReg('')"><b>${S.calls}</b>📞 Chiamate ${rng==='today'?'oggi':'totali'}</div>
 <div class="card" onclick="goReg('app')"><b>${S.app}</b>📅 Appuntamenti fissati</div>
 <div class="card" onclick="goReg('cb')"><b>${S.cb}</b>🔁 Da ricontattare${S.due?`<i>${S.due} scaduti o per oggi</i>`:''}</div>
 <div class="card" onclick="goReg('no')"><b>${S.no}</b>❌ Non interessati</div></div>
 <div class="muted" style="padding:0 10px 8px">Aziende contattate: ${S.comp} · Interessati: ${S.int} · In trattativa: ${S.trat} · Non risponde: ${S.nr}<br>💾 Ultimo backup: ${localStorage.getItem('dw_lastbak')?new Date(+localStorage.getItem('dw_lastbak')).toLocaleDateString('it-IT'):'mai — fanne uno!'}</div>`;
 const q=($('rq').value||'').trim(),list=q?all.filter(d=>matchQ(d,q)):all.filter(d=>!f||d.st===f);
 $('reg').innerHTML=(q?`<div class="muted" style="padding:8px 12px">${list.length} risultat${list.length===1?'o':'i'} per «${esc(q)}» (in tutto il registro)</div>`:'')+
  (list.map(d=>row(d,1)).join('')||`<p class="muted pad">${q?'Nessun risultato per «'+esc(q)+'».':'Nessuna azienda in questo elenco.'}</p>`);
}
const lead=id=>results.find(r=>r.id===id)||db[id];
function ensure(id){const r=lead(id);db[id]=Object.assign({},db[id],{id,name:r.name,phone:r.phone,web:r.web,addr:r.addr,kind:r.kind,q:r.q,lat:r.lat,lng:r.lng});return db[id]}
function called(id){const d=ensure(id);d.calls=(d.calls||0)+1;d.last=Date.now();(d.hist=d.hist||[]).push(Date.now());if(!d.st)d.st='called';save();pending=id;setTimeout(render,300)}
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&pending){const id=pending;pending=null;render();openPanel(id)}});
function openPanel(id){
 curId=id;const r=lead(id),d=db[id]||{};
 $('panel').style.display='block';
 $('panel').innerHTML=`<div class="row"><b style="flex:1;font-size:17px">${esc(r.name)}</b><button class="btn g" onclick="closePanel()">✕</button></div>
 <div class="muted">${esc(r.kind)}${r.addr?' · '+esc(r.addr):''}${r.rating?' · ⭐'+r.rating+' ('+r.n+')':''}</div>
 ${d.calls?`<div class="warn">⚠ Già chiamato ${d.calls} volt${d.calls>1?'e':'a'} – ultima: ${new Date(d.last).toLocaleString('it-IT')}</div>`:''}
 ${r.phone?`<a class="call" href="tel:${tel(r)}" onclick="called('${id}')">📞 Chiama ${esc(r.phone)}</a>`:'<div class="warn">Nessun telefono disponibile</div>'}
 <div class="seo"><b>📈 ${slab(seo(r).n)} <span style="color:${scol(seo(r).n)}">${stars(seo(r).n)}</span></b><br>${seo(r).w}<br>
 <b>3 keyword su cui posizionarlo:</b><br>${keywords(r).map(x=>`• <a href="https://www.google.com/search?q=${encodeURIComponent(x)}" target="_blank">${esc(x)} 🔎</a>`).join('<br>')}
 <div class="muted">Tocca 🔎 per vedere se l'azienda compare già su Google. Le stelle sono una stima, non la posizione reale.</div></div>
 <div class="muted">Stato della trattativa:</div>
 <div class="st">${Object.entries(ST).map(([k,[l,c]])=>`<button class="${d.st===k?'on':''}" style="background:${d.st===k?c+'33':''}" onclick="setSt('${id}','${k}')">${l}</button>`).join('')}</div>
 ${['cb','app','trat'].includes(d.st)?`<div class="muted">${{cb:'📅 Data di ricontatto',app:'📅 Data appuntamento',trat:'📅 Prossimo contatto'}[d.st]}</div><input type="date" value="${d.when||''}" onchange="setWhen('${id}',this.value)" style="margin-bottom:8px">`:''}
 <div class="muted">Dati azienda (da inserire a mano):</div>
 <input type="text" placeholder="Titolare / referente" value="${esc(d.owner||'')}" onchange="setF('${id}','owner',this.value)" style="margin-bottom:6px">
 <div class="row" style="margin-bottom:6px"><input type="text" inputmode="numeric" placeholder="Partita IVA" value="${esc(d.piva||'')}" onchange="setF('${id}','piva',this.value)"><input type="text" inputmode="email" placeholder="Email" value="${esc(d.email||'')}" onchange="setF('${id}','email',this.value)"></div>
 <p class="muted" style="margin:0 0 8px"><a href="https://www.google.com/search?q=${encodeURIComponent('"'+r.name+'" '+cityOf(r)+' partita iva titolare')}" target="_blank">🔎 Cerca P.IVA e titolare su Google</a></p>
 <textarea id="nt" rows="3" placeholder="Note sulla trattativa (es. referente, richiamare giovedì, interessato a SEO…)">${esc(d.notes||'')}</textarea>
 <div class="row" style="margin-top:8px"><button class="btn" style="flex:1" onclick="nextLead()">Salva e prossimo ▶</button></div>
 <p class="muted">${r.web?`<a href="${esc(r.web)}" target="_blank">🌐 Sito</a> · `:''}<a href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(r.name)}&query_place_id=${id}" target="_blank">🗺️ Apri in Google Maps</a></p>`;
}
function setWhen(id,v){const d=ensure(id);d.when=v;save();render()}
function setF(id,k,v){const d=ensure(id);d[k]=v.trim();save();render()}
const done=id=>{const d=db[id];return !!(d&&(d.st||d.calls))};
function saveNotes(){const t=$('nt');if(t&&curId&&(t.value||(db[curId]&&db[curId].notes))){const d=ensure(curId);d.notes=t.value;save()}}
function setSt(id,s){saveNotes();const d=ensure(id);d.st=s;d.last=Date.now();if(s==='cb'&&(!d.when||d.when<today()))d.when=dstr(Date.now()+864e5);save();render();openPanel(id)}
function closePanel(){saveNotes();$('panel').style.display='none';curId=null;render()}
function nextLead(){
 saveNotes();render();
 const nx=visible().filter(r=>r.phone&&r.id!==curId&&(lv==='cb'||!done(r.id)))[0];
 if(!nx){closePanel();return alert('Nessun altro contatto da chiamare in questa ricerca.')}
 map.panTo({lat:nx.lat,lng:nx.lng});openPanel(nx.id);
}
function exportCsv(){
 const rows=[['Nome','Tipo','Telefono','Sito','Indirizzo','Stato','Chiamate','Ultima chiamata','Data ricontatto/appuntamento','Note','Titolare','Partita IVA','Email']];
 Object.values(db).forEach(d=>rows.push([d.name,d.kind,d.phone,d.web,d.addr,d.st?ST[d.st][0]:'',d.calls||0,d.last?new Date(d.last).toLocaleString('it-IT'):'',d.when||'',d.notes||'',d.owner||'',d.piva||'',d.email||'']));
 const csv=rows.map(r=>r.map(c=>`"${String(c??'').replace(/"/g,'""')}"`).join(';')).join('\n');
 const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+csv],{type:'text/csv'}));a.download='lead-diamondweb.csv';a.click();
}
