<!DOCTYPE html>
<html lang="it"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#2563eb"><title>Diamondweb Leads</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;font:15px system-ui,sans-serif;color:#1f2937;background:#f3f4f6}
button,input,select,textarea{font:inherit}
#app{height:100%;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top)}
#top{background:#fff;padding:8px;display:flex;flex-direction:column;gap:6px;box-shadow:0 1px 4px #0002;z-index:1000;position:relative}
.row{display:flex;gap:6px;align-items:center}
input[type=text],select,textarea{padding:10px;border:1px solid #d1d5db;border-radius:8px;width:100%;background:#fff}
.btn{padding:10px 14px;border:0;border-radius:8px;background:#2563eb;color:#fff;cursor:pointer;white-space:nowrap}
.btn.g{background:#e5e7eb;color:#111}.btn:disabled{opacity:.5}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.chip{flex:none;padding:6px 11px;border-radius:16px;background:#e5e7eb;font-size:13px;border:0}
.chip.on{background:#2563eb;color:#fff}
#views{flex:1;position:relative;min-height:0}
.view{position:absolute;inset:0;overflow:auto;display:none;background:#f3f4f6}
.view.on{display:block}
#map{width:100%;height:100%}
#fab{position:absolute;left:50%;transform:translateX(-50%);bottom:14px;z-index:1000;box-shadow:0 2px 8px #0005;border-radius:24px;padding:12px 20px}
#loc{position:absolute;right:10px;bottom:14px;z-index:1000;width:44px;height:44px;border-radius:22px;border:0;background:#fff;box-shadow:0 2px 8px #0004;font-size:20px}
#sheet{position:absolute;left:8px;right:8px;bottom:70px;z-index:1000;background:#fff;border-radius:12px;padding:10px 12px;box-shadow:0 2px 12px #0005;display:none}
.item{background:#fff;padding:12px;border-bottom:1px solid #eee}
.item b{display:block}.item small{color:#6b7280}
.tag{display:inline-block;font-size:11px;padding:1px 7px;border-radius:9px;color:#fff;margin-left:4px}
nav{display:flex;background:#fff;border-top:1px solid #e5e7eb;padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;padding:10px 0;border:0;background:none;font-size:12px;color:#6b7280}
nav button.on{color:#2563eb;font-weight:600}nav span{display:block;font-size:20px}
.pad{padding:14px}
.call{display:block;text-align:center;background:#16a34a;color:#fff;text-decoration:none;padding:16px;border-radius:10px;font-size:18px;font-weight:600;margin:10px 0}
.st{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0}
.st button{padding:12px;border:2px solid transparent;border-radius:8px;background:#fff;cursor:pointer}
.st button.on{border-color:#111}
.warn{background:#fef3c7;padding:9px;border-radius:8px;font-size:13px;margin:8px 0}
.site{width:100%;height:65vh;border:1px solid #ccc;border-radius:12px;background:#fff}
.muted{color:#6b7280;font-size:13px}
.pitch{background:#e0f2fe;border-radius:8px;padding:10px;font-size:13px;margin:12px 0;line-height:1.4}
</style></head><body>
<div id="app">
 <div id="top">
  <div class="row"><input type="text" id="place" placeholder="Vai a città (es. Bologna)" onkeydown="if(event.key=='Enter')goTo()">
   <button class="btn g" onclick="goTo()">Vai</button></div>
  <div class="row"><select id="type" style="flex:1"></select>
   <button class="btn" onclick="search()">🔍</button></div>
  <input type="text" id="custom" placeholder="…oppure cerca per nome (es. Studio)" hidden>
  <div class="chips">
   <button class="chip on" id="cPhone" onclick="tog('cPhone')">📞 Con telefono</button>
   <button class="chip" id="cNoWeb" onclick="tog('cNoWeb')">🔥 Hot lead</button>
   <button class="chip on" data-v="new" onclick="setView('new',this)">Nuovi</button>
   <button class="chip" data-v="cb" onclick="setView('cb',this)">Da richiamare</button>
   <button class="chip" data-v="done" onclick="setView('done',this)">Contattati</button>
   <button class="chip" data-v="all" onclick="setView('all',this)">Tutti</button>
  </div>
 </div>
 <div id="views">
  <div class="view on" id="v-map"><div id="map"></div>
   <div id="sheet"></div>
   <button id="loc" onclick="locate()">📍</button>
   <button class="btn" id="fab" onclick="search()">Cerca in quest'area</button></div>
  <div class="view" id="v-list"><div id="list"></div></div>
  <div class="view" id="v-detail"><div class="pad" id="detail"><p class="muted">Seleziona un contatto dalla mappa o dalla lista.</p></div></div>
 </div>
 <nav>
  <button class="on" data-t="map" onclick="tab('map')"><span>🗺️</span>Mappa</button>
  <button data-t="list" onclick="tab('list')"><span>📋</span><i id="cnt">Lista</i></button>
  <button data-t="detail" onclick="tab('detail')"><span>👤</span>Scheda</button>
  <button onclick="exportCsv()"><span>⬇️</span>CSV</button>
 </nav>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
const ST={ok:['Interessato','#16a34a'],app:['Appuntamento','#7c3aed'],cb:['Richiamare','#f59e0b'],nr:['Non risponde','#6b7280'],no:['Non interessato','#dc2626']};
const DONE=['ok','app','no'];
// tipologia -> tag OpenStreetMap
// 💎 categorie ad alto valore per Diamondweb (SEO + CRO): ticket alto, ricerche locali, richieste di preventivo
const HVT={'Imprese edili':['craft=builder','office=construction_company','craft=construction'],
'Studi di architettura':['office=architect'],'Geometri e ingegneri':['office=surveyor','office=engineer'],
'Serramenti e infissi':['craft=window_construction','shop=doors','~serramenti|infissi'],
'Fotovoltaico e energia':['~fotovolt|solar|pannelli|energia'],
'Climatizzazione e termoidraulica':['craft=hvac','shop=heating','craft=plumber','~climatizz|caldai'],
'Impianti elettrici':['craft=electrician'],'Falegnami e arredo su misura':['craft=carpenter','shop=furniture'],
'Imbianchini e cartongesso':['craft=painter','craft=plasterer'],'Cucine e arredo bagno':['shop=kitchen','shop=bathroom_furnishing'],
'Concessionarie auto':['shop=car'],'Carrozzerie':['~carrozzeri'],
'Cliniche e poliambulatori':['amenity=clinic','healthcare=clinic'],'Fisioterapisti':['healthcare=physiotherapist'],
'Veterinari':['amenity=veterinary'],'Dentisti':['amenity=dentist','healthcare=dentist'],
'Cantine e agriturismi':['craft=winery','agritourism=yes'],'Autoscuole':['amenity=driving_school'],
'Traslochi e logistica':['office=moving_company','~traslochi'],'Paesaggisti e giardinieri':['craft=gardener'],
'Notai e consulenti':['office=notary','office=tax_advisor','office=financial'],
'Avvocati':['office=lawyer'],'Commercialisti':['office=accountant'],'Agenzie immobiliari':['office=estate_agent','shop=estate_agent']};
const OTH={'Ristoranti':['amenity=restaurant'],'Bar e caffè':['amenity=bar','amenity=cafe'],'Pizzerie':['cuisine=pizza'],
'Parrucchieri':['shop=hairdresser'],'Centri estetici':['shop=beauty'],'Studi medici':['amenity=doctors'],
'Idraulici':['craft=plumber','shop=plumber'],'Officine':['shop=car_repair'],'Hotel':['tourism=hotel'],
'B&B / Affittacamere':['tourism=guest_house'],'Abbigliamento':['shop=clothes'],'Palestre':['leisure=fitness_centre'],
'Fioristi':['shop=florist'],'Ottici':['shop=optician'],'Agenzie di viaggio':['shop=travel_agency'],
'Panetterie':['shop=bakery'],'Altro (cerca per nome)':[]};
const TYPES={...HVT,...OTH},HV=new Set(Object.keys(HVT));
let map,layer,results=[],markers={},sel=null,view='new',pendingCall=null;
let db=JSON.parse(localStorage.getItem('leadmap_osm')||'{}');
const save=()=>localStorage.setItem('leadmap_osm',JSON.stringify(db));
const $=id=>document.getElementById(id);
const opts=o=>Object.keys(o).map(t=>`<option>${t}</option>`).join('');
$('type').innerHTML=`<optgroup label="💎 Alto valore (SEO/CRO)">${opts(HVT)}</optgroup><optgroup label="Altre attività locali">${opts(OTH)}</optgroup>`;
$('type').onchange=()=>$('custom').hidden=TYPES[$('type').value].length>0;

map=L.map('map',{zoomControl:false}).setView([45.4642,9.19],15);
L.control.zoom({position:'topleft'}).addTo(map);
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(map);
layer=L.layerGroup().addTo(map);
map.on('click',()=>$('sheet').style.display='none');
locate(true);

function locate(silent){
 navigator.geolocation?navigator.geolocation.getCurrentPosition(p=>map.setView([p.coords.latitude,p.coords.longitude],16),
  ()=>{if(!silent)alert('Posizione non disponibile')},{enableHighAccuracy:true,timeout:8000}):0;
}
async function goTo(){
 const q=$('place').value.trim();if(!q)return;
 try{const r=await(await fetch('https://nominatim.openstreetmap.org/search?format=json&limit=1&accept-language=it&q='+encodeURIComponent(q))).json();
  if(!r[0])return alert('Luogo non trovato');
  const b=r[0].boundingbox;map.fitBounds([[b[0],b[2]],[b[1],b[3]]]);tab('map')}catch(e){alert('Errore: '+e.message)}
}
async function search(){
 const t=$('type').value,tags=TYPES[t],name=$('custom').value.trim();
 if(!tags.length&&!name)return $('custom').focus();
 if(map.getZoom()<13)return alert('Zooma di più (area troppo grande).');
 const b=map.getBounds(),bb=`${b.getSouth()},${b.getWest()},${b.getNorth()},${b.getEast()}`;
 const nm=name?`["name"~"${name.replace(/[\\"]/g,'')}",i]`:'';
 const esc2=x=>x.replace(/[\\"]/g,'');
 const sel=tags.length?tags.map(x=>{
   if(x[0]==='~')return['craft','office','shop'].map(k=>`nwr["${k}"]["name"~"${esc2(x.slice(1))}",i]${nm}(${bb});`).join('');
   const[k,v]=x.split('=');return`nwr["${k}"="${v}"]${nm}(${bb});`}).join('')
  :`nwr["name"~"${esc2(name)}",i]["shop"](${bb});nwr["name"~"${esc2(name)}",i]["office"](${bb});nwr["name"~"${esc2(name)}",i]["amenity"](${bb});`;
 const q=`[out:json][timeout:25];(${sel});out center tags 300;`;
 tab('map');$('fab').disabled=true;$('fab').textContent='Ricerca…';
 try{
  const res=await fetch('https://overpass-api.de/api/interpreter',{method:'POST',body:'data='+encodeURIComponent(q)});
  if(!res.ok)throw new Error('server occupato ('+res.status+'), riprova');
  const j=await res.json();
  results=j.elements.filter(e=>e.tags&&e.tags.name).map(e=>{const g=e.tags;
   const ph=(g.phone||g['contact:phone']||g.mobile||g['contact:mobile']||'').split(';')[0].trim();
   let w=(g.website||g['contact:website']||g.url||'').trim();if(w&&!/^https?:/.test(w))w='http://'+w;
   const addr=[[g['addr:street'],g['addr:housenumber']].filter(Boolean).join(' '),g['addr:city']].filter(Boolean).join(', ');
   return{id:e.type[0]+e.id,name:g.name,phone:ph,web:w,addr,kind:t.startsWith('Altro')?'Attività':t,
    lat:e.lat??e.center?.lat,lng:e.lon??e.center?.lon}}).filter(r=>r.lat);
  render();
 }catch(e){alert('Errore ricerca: '+e.message)}
 $('fab').disabled=false;$('fab').textContent="Cerca in quest'area";
}
const SOCIAL=/facebook\.|instagram\.|linktr\.ee|tiktok\.|wa\.me/i;
function score(r){return !r.web||SOCIAL.test(r.web)?3:/^http:/i.test(r.web)?2:1}
function opp(r){const s=score(r);
 return (HV.has(r.kind)?'<span class="tag" style="background:#0ea5e9">💎</span>':'')+
 (!r.web?'<span class="tag" style="background:#ea580c">no sito</span>':SOCIAL.test(r.web)?'<span class="tag" style="background:#ea580c">solo social</span>':s===2?'<span class="tag" style="background:#d97706">no HTTPS</span>':'')}
function pitch(r){const s=score(r);let t=
 !r.web?"L'attività non ha un sito proprio: non intercetta chi cerca su Google. <b>Proposta:</b> sito veloce con SEO locale («"+esc(r.kind.toLowerCase())+" + città»), scheda Google Business collegata e form/pulsante «chiedi preventivo».":
 SOCIAL.test(r.web)?"È presente solo sui social, che non portano traffico da ricerca. <b>Proposta:</b> sito con SEO locale e CRO (CTA chiare, form preventivo, click-to-call).":
 s===2?"Il sito è senza HTTPS: il browser lo segna «non sicuro» e Google lo penalizza. <b>Proposta:</b> migrazione + audit SEO/CRO.":
 "Ha già un sito. <b>Proposta:</b> audit SEO/CRO gratuito (velocità, contenuti, form e CTA) per aumentare le richieste di preventivo. Usa il tasto ⚡ PageSpeed per avere un dato concreto.";
 if(HV.has(r.kind))t+="<br>💎 Settore ad alto valore: un solo cliente in più ripaga il progetto.";
 return t}
const on=id=>$(id).classList.contains('on');
function tog(id){$(id).classList.toggle('on');render()}
function setView(v,el){view=v;document.querySelectorAll('[data-v]').forEach(c=>c.classList.toggle('on',c===el));render()}
function tab(t){document.querySelectorAll('.view').forEach(v=>v.classList.toggle('on',v.id==='v-'+t));
 document.querySelectorAll('nav [data-t]').forEach(b=>b.classList.toggle('on',b.dataset.t===t));
 if(t==='map')setTimeout(()=>map.invalidateSize(),50)}
const status=id=>db[id]&&db[id].st;
function visible(){return results.filter(r=>{
 if(on('cPhone')&&!r.phone)return false;
 if(on('cNoWeb')&&score(r)<3)return false;
 const s=status(r.id);
 if(view==='new')return !s;
 if(view==='cb')return s==='cb'||s==='nr';
 if(view==='done')return DONE.includes(s);
 return true}).sort((a,b)=>score(b)-score(a))}
function render(){
 const vis=visible();
 $('cnt').textContent=`Lista (${vis.length}/${results.length})`;
 $('list').innerHTML=vis.map(r=>{const s=status(r.id);
  return `<div class="item" onclick="pick('${r.id}',true)"><b>${esc(r.name)}${s?`<span class="tag" style="background:${ST[s][1]}">${ST[s][0]}</span>`:''}${opp(r)}</b>
  <small>${esc(r.kind)} · ${esc(r.addr||'indirizzo n/d')}</small><br><small>📞 ${esc(r.phone||'—')}</small></div>`}).join('')||'<p class="muted pad">Nessun risultato. Prova a togliere «Con telefono»: su OpenStreetMap molte attività non hanno il numero.</p>';
 layer.clearLayers();markers={};
 vis.forEach(r=>{const s=status(r.id);
  const m=L.circleMarker([r.lat,r.lng],{radius:sel===r.id?12:9,color:'#fff',weight:2,fillColor:s?ST[s][1]:'#2563eb',fillOpacity:1}).addTo(layer);
  m.on('click',e=>{L.DomEvent.stopPropagation(e);pick(r.id,false)});markers[r.id]=m});
}
function pick(id,openDetail){
 sel=id;const r=results.find(x=>x.id===id);detail(r);
 if(openDetail){tab('detail');map.panTo([r.lat,r.lng])}
 else{const s=$('sheet');s.style.display='block';
  s.innerHTML=`<b>${esc(r.name)}</b><div class="muted">${esc(r.kind)} · 📞 ${esc(r.phone||'—')}</div>
  <div class="row" style="margin-top:8px">${r.phone?`<a class="btn" style="background:#16a34a;text-decoration:none" href="tel:${tel(r)}" onclick="called('${r.id}')">📞 Chiama</a>`:''}
  <button class="btn g" onclick="tab('detail')">Scheda</button></div>`;}
}
const tel=r=>r.phone.replace(/[^\d+]/g,'');
function detail(r){
 const d=db[r.id]||{};
 $('detail').innerHTML=`<h3 style="margin:0 0 4px">${esc(r.name)}</h3><div class="muted">${esc(r.kind)} · ${esc(r.addr||'')}</div>
 ${d.calls?`<div class="warn">⚠ Già chiamato ${d.calls} volt${d.calls>1?'e':'a'} – ultima: ${new Date(d.last).toLocaleString('it-IT')}</div>`:''}
 ${r.phone?`<a class="call" href="tel:${tel(r)}" onclick="called('${r.id}')">📞 Chiama ${esc(r.phone)}</a>`:'<div class="warn">Nessun telefono su OpenStreetMap per questa attività</div>'}
 <div class="muted">Esito chiamata:</div>
 <div class="st">${Object.entries(ST).map(([k,[l,c]])=>`<button class="${d.st===k?'on':''}" style="background:${d.st===k?c+'33':''}" onclick="setSt('${r.id}','${k}')">${l}</button>`).join('')}
 <button onclick="setSt('${r.id}',null)">↺ Azzera</button></div>
 <textarea rows="3" placeholder="Note…" onchange="setNotes('${r.id}',this.value)">${esc(d.notes||'')}</textarea>
 <div class="pitch"><b>💎 Spunto Diamondweb</b><br>${pitch(r)}</div>
 <h4 style="margin:16px 0 6px">Sito web ${r.web?`<a class="muted" href="${esc(r.web)}" target="_blank">↗ apri</a> · <a class="muted" href="https://pagespeed.web.dev/analysis?url=${encodeURIComponent(r.web)}" target="_blank">⚡ PageSpeed</a>`:''} · <a class="muted" href="https://www.google.com/search?q=${encodeURIComponent(r.name+' '+(r.addr||''))}" target="_blank">🔎 Google</a></h4>
 ${r.web?`<iframe class="site" src="${esc(r.web)}" referrerpolicy="no-referrer"></iframe>
 <p class="muted">Se resta vuoto il sito blocca l'incorporamento: tocca «apri».</p>`
 :'<div class="warn">🔥 Nessun sito registrato: potenziale lead per un sito web.</div>'}`;
}
function meta(id){const r=results.find(x=>x.id===id);db[id]=Object.assign({},db[id],{name:r.name,phone:r.phone,web:r.web,addr:r.addr,kind:r.kind});return db[id]}
function called(id){const d=meta(id);d.calls=(d.calls||0)+1;d.last=Date.now();if(!d.st)d.st='nr';save();pendingCall=id}
document.addEventListener('visibilitychange',()=>{
 if(!document.hidden&&pendingCall){const r=results.find(x=>x.id===pendingCall);pendingCall=null;
  render();detail(r);$('sheet').style.display='none';tab('detail')}});
function setSt(id,s){const d=meta(id);if(s){d.st=s;d.last=Date.now()}else delete d.st;save();render();detail(results.find(x=>x.id===id))}
function setNotes(id,v){meta(id).notes=v;save()}
function exportCsv(){
 const rows=[['Nome','Tipo','Telefono','Sito','Indirizzo','Esito','Chiamate','Ultima chiamata','Note']];
 Object.values(db).forEach(d=>rows.push([d.name,d.kind,d.phone,d.web,d.addr,d.st?ST[d.st][0]:'',d.calls||0,d.last?new Date(d.last).toLocaleString('it-IT'):'',d.notes||'']));
 const csv=rows.map(r=>r.map(c=>`"${String(c??'').replace(/"/g,'""')}"`).join(';')).join('\n');
 const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+csv],{type:'text/csv'}));a.download='lead.csv';a.click();
}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
</script></body></html>
